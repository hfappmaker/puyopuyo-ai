[package]
name = "puyo-trainer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "generate-data"
path = "src/bin/generate_data.rs"

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "self-play"
path = "src/bin/self_play.rs"

[features]
default = ["gpu"]
gpu = ["burn/cuda-jit", "burn/fusion", "burn/autotune", "puyo-player/cuda"]

[dependencies]
az-framework = { path = "../../az-framework" }
puyo-core = { path = "../puyo-core" }
puyo-player = { path = "../puyo-player", features = ["nn"] }
puyo-nn = { path = "../puyo-nn" }
burn = { version = "0.16", features = ["autodiff", "train"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
